# 通常のファイルとディレクトリは Emacs で開く。
[[opener.emacs]]
run = "emacs -nw %s"
block = true
for = "unix"
desc = "Open with Emacs"

# Numbers の書類は macOS の Numbers で開く。
[[opener.numbers]]
run = "open -a Numbers %s"
for = "macos"
desc = "Open with Numbers"

# 画像は macOS の Preview で開く。
[[opener.preview]]
run = "open -a Preview %s"
for = "macos"
desc = "Open with Preview"

# Web location は .webloc 内の URL を取り出して Chrome で開く。
[[opener.chrome]]
run = 'url="$(plutil -extract URL raw -o - %s)" && open -a "Google Chrome" "$url"'
for = "macos"
desc = "Open with Chrome"

# Shift+Enter の選択メニューから Chrome のプライベートモードでも開ける。
[[opener.chrome-private]]
run = 'url="$(plutil -extract URL raw -o - %s)" && open -na "Google Chrome" --args --incognito "$url"'
for = "macos"
desc = "Open with Chrome Private"

# 専用アプリで開くものを先に判定し、それ以外は Emacs に渡す。
[[open.prepend_rules]]
url = "*.numbers"
use = "numbers"

[[open.prepend_rules]]
mime = "image/*"
use = "preview"

[[open.prepend_rules]]
url = "*.webloc"
use = [ "chrome", "chrome-private" ]

# 圧縮ファイルは Emacs ではなく Yazi の組み込み機能で展開する。
[[open.prepend_rules]]
mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}"
use = "extract"

[[open.prepend_rules]]
url = "*/"
use = "emacs"

[[open.prepend_rules]]
url = "*"
use = "emacs"
