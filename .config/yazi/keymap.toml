# q は表示だけ閉じ、Q は Yazi 内の現在位置を shell へ返す。
[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Quit without changing directory"

[[mgr.prepend_keymap]]
on = "Q"
run = "quit"
desc = "Quit and change directory"

# カーソル位置がディレクトリならそこでLazygitを起動する。
# ファイル上または何も選択していない場合は現在のディレクトリを使う。
[[mgr.prepend_keymap]]
on = "<A-g>"
run = 'shell --block -- if [ -d %h ]; then cd %h || exit; fi; lazygit'
desc = "Open Lazygit in hovered directory"
