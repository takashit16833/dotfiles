# Lazygit のユーザー設定。
#
# diff 表示は git-delta の縦並び / 横並びの2種類を用意し、
# Lazygit 標準の `|` キーで用途に応じて切り替える。
gui:
  language: en

  # Nerd Fonts v3 のアイコンを使用する。
  # nerdFontsVersion: "3"

  # Files 画面で各ファイルの追加・削除行数を表示する。
  showNumstatInFilesView: true

  # ブランチが基準ブランチから何コミット進んでいる / 遅れているか表示する。
  showDivergenceFromBaseBranch: arrowAndNumber

  # `/` 検索を部分一致ではなく、あいまい検索にする。
  filterMode: fuzzy

git:
  # コミット一覧で現在のブランチだけでなく、
  # 他のブランチを含むリポジトリ全体の履歴グラフを表示する。
  log:
    showWholeGraph: true
  diffRenderers:
    # 通常の縦並び diff。情報量を抑え、普段の変更確認で使いやすくする。
    - name: delta-vertical
      colorArg: always
      command: delta --dark --paging=never

    # 左右比較したいとき用の横並び diff。
    # delta の side-by-side 表示を使い、`|` で縦並びとの間を循環する。
    - name: delta-side-by-side
      colorArg: always
      command: delta --dark --paging=never --side-by-side
