# Starship の表示は、普段必要な「現在地」「Git ブランチ」「入力記号」だけに絞る。
# 言語バージョンや package 情報などは、必要になったときだけ追加する。
format = "$directory$git_branch$character"

# プロンプト間の空行をなくし、Terminal をコンパクトに使う。
add_newline = false

# WezTerm の Retro Hacker Blue + Cyber Pink と色を揃える。
palette = "retro_hacker"

[palettes.retro_hacker]
blue = "#5EAFFF"
cyber_pink = "#FF4DE1"

[directory]
# 現在地は Retro Hacker Blue の明るい青で表示する。
style = "bold blue"

# Starship の標準どおり、深すぎるパスは 3 階層までに省略する。
# 長い絶対パスでプロンプトが横に伸びすぎるのを防ぐ。
truncation_length = 3

# directory モジュール自身が末尾の空白を持つため、
# Git 管理外ではこの直後に character が自然につながる。
format = "[$path]($style) "

[git_branch]
# Git repository 内だけ、現在のブランチ名を Cyber Pink で表示する。
symbol = " "
style = "bold cyber_pink"
format = "[$symbol$branch]($style) "

[character]
# 入力位置も Cyber Pink に統一する。
# 成功/失敗で記号の見た目を変えず、プロンプトの情報量を増やさない。
success_symbol = "[❯](bold cyber_pink)"
error_symbol = "[❯](bold cyber_pink)"
