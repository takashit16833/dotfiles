# macOS 固有のショートカットを用途ごとに管理する。
# シェルの行編集は zsh 側で定義し、Kitty は必要なキー入力だけを送る。

# --- 修飾キー ---------------------------------------------------------------

# Option を Meta として使い、Emacs などのターミナルアプリへ渡す。
# 個別に定義した Option のキーマップは、その割り当てを優先する。
macos_option_as_alt both

# --- Emacs へ渡すキー -------------------------------------------------------

# Kitty 側の Cmd+L の割り当てを解除し、Emacs の行選択に使えるようにする。
map cmd+l

# Cmd+Enter と Cmd+Shift+Enter は Kitty 側で処理せず、Emacs の行挿入に使う。
map cmd+enter
map cmd+shift+enter

# --- シェルの行編集 ---------------------------------------------------------

# Cmd+左矢印で行頭、Cmd+右矢印で行末へ移動するため、Ctrl+A / Ctrl+E を送る。
map cmd+left send_key ctrl+a
map cmd+right send_key ctrl+e

# 通常のシェルでは行頭まで削除し、拡張キーボード対応アプリには元のキーを渡す。
map cmd+backspace combine : send_text normal,application \e\x15 : send_key cmd+backspace
# カーソル位置から行末まで削除
map cmd+delete send_key ctrl+k

# Option+左矢印 / 右矢印で単語単位に前後へ移動する。
map opt+left send_key alt+b
map opt+right send_key alt+f

# Option+Backspace で前の単語、Option+Delete で次の単語を削除する。
map opt+backspace send_key alt+backspace
map opt+delete send_key alt+d

# zsh の zi / lazygit ウィジェットを起動するため、それぞれ ESC シーケンスを送る。
map opt+z send_text all \ez
map opt+g send_text all \eg

# --- コピー・シェル履歴 -----------------------------------------------------

# Cmd+C で選択範囲をコピーし、選択がなければ直前のコマンド出力をコピーする。
map cmd+c copy_selection_or_last_command_output

# Ctrl+Shift+X / Z で、前 / 次のシェルプロンプトへスクロールする。
# Shell integration により、移動先の出力を @last_visited_cmd_output として参照できる。
map ctrl+shift+x scroll_to_prompt -1
map ctrl+shift+z scroll_to_prompt 1

# Cmd+Shift+C で、最後に移動したプロンプトのコマンド出力をコピーする。
map cmd+shift+c launch --type=clipboard --stdin-source=@last_visited_cmd_output

# --- タブ・画面分割 ---------------------------------------------------------

# Ctrl+PageUp / PageDown で前 / 次の Kitty タブへ切り替える。
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

# Cmd+T で、現在の作業ディレクトリを引き継いだタブを同じ Session に追加する。
map cmd+t new_tab_with_cwd

# Cmd+Shift+S で上下に、Cmd+Shift+V で左右に画面を分割する。
# 新しいペインは現在の作業ディレクトリを引き継ぐ。
map cmd+shift+s combine : goto_layout splits : launch --cwd=current --location=hsplit
map cmd+shift+v combine : goto_layout splits : launch --cwd=current --location=vsplit

# --- Kitty の機能 -----------------------------------------------------------

# Ctrl+Shift+F3 で、Kitty の機能を検索して実行するコマンドパレットを開く。
map ctrl+shift+f3 command_palette