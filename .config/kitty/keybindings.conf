# WezTerm で使っていた macOS 固有ショートカットを Kitty へ移植する。
# 行編集そのものの意味は zsh 側に持たせ、Terminal は対応するキーへ変換するだけにする。

# Cmd + Left / Right -> Ctrl-A / Ctrl-E
map cmd+left send_key ctrl+a
map cmd+right send_key ctrl+e

# Cmd + Backspace / Delete -> Meta-Ctrl-U / Ctrl-K
map cmd+backspace send_key ctrl+alt+u
map cmd+delete send_key ctrl+k

# Option + Left / Right -> Meta-B / Meta-F
map opt+left send_key alt+b
map opt+right send_key alt+f

# Option + Backspace / Delete -> Meta-Backspace / Meta-D
map opt+backspace send_key alt+backspace
map opt+delete send_key alt+d

# zsh 側の zi / lazygit widget 用に、WezTerm と同じ ESC sequence を送る。
map opt+z send_text all \ez
map opt+g send_text all \eg
