# macOS 固有ショートカットを Kitty 側で扱う。
# 行編集そのものの意味は zsh 側に持たせ、Terminal は対応するキーへ変換するだけにする。

# Zellij などの Terminal application で Option を Alt modifier として利用する。
# 下記の個別 map は優先されるため、既存の Option 操作はそのまま維持する。
macos_option_as_alt both

# Cmd + Left / Right -> Ctrl-A / Ctrl-E
map cmd+left send_key ctrl+a
map cmd+right send_key ctrl+e

# Cmd + Backspace / Delete -> Meta-Ctrl-U / Ctrl-K
map cmd+backspace send_key ctrl+alt+u
map cmd+delete send_key ctrl+k

# Option + Left / Right -> Meta-B / Meta-F
map opt+left send_key alt+b
map opt+right send_key alt+f

# Option + Backspace / Delete -> Meta-Backspace / Meta-D
map opt+backspace send_key alt+backspace
map opt+delete send_key alt+d

# Cmd + C は選択中ならその範囲を、未選択なら直前のコマンド出力をコピーする。
map cmd+c copy_selection_or_last_command_output

# Zellij 内では Super 修飾が失われる場合があるため、Cmd+Z / Cmd+Shift+Z を
# 通常の ESC シーケンス（Meta-z / Meta-Z）として送る。Emacs 側で Undo / Redo に割り当てる。
# Kitty のキーマップは Emacs 以外のアプリにも適用される。
map cmd+z send_text all \ez
map cmd+shift+z send_text all \eZ

# Ctrl + Shift + Z / X で前後の shell prompt へ移動する。
# Shell integration により、移動先のコマンド出力を @last_visited_cmd_output として参照できる。
map ctrl+shift+x scroll_to_prompt -1
map ctrl+shift+z scroll_to_prompt 1

# Cmd + Shift + C で、最後に移動した prompt のコマンド出力をクリップボードへコピーする。
map cmd+shift+c launch --type=clipboard --stdin-source=@last_visited_cmd_output

# Ctrl + PageUp / PageDown で前後の Kitty tab へ移動する。
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

# 新しいタブを現在のSessionに追加する。
map cmd+t new_tab_with_cwd

# Ctrl + Shift + F3 で Kitty の機能を検索・実行できるコマンドパレットを開く。
map ctrl+shift+f3 command_palette

# Cmd + Option + Left / Right は Zellij 専用の Alt-Shift-Left / Right として渡す。
# Option + Left / Right 単体の zsh word navigation とは衝突させない。
map cmd+opt+left send_key alt+shift+left
map cmd+opt+right send_key alt+shift+right

# zsh 側の zi / lazygit widget 用に ESC sequence を送る。
map opt+z send_text all \ez
map opt+g send_text all \eg

# Cmd+Enter / Cmd+Shift+Enter はEmacsへ渡す。
map cmd+enter
map cmd+shift+enter

# Kittyの画面分割。
map cmd+opt+enter combine : goto_layout splits : launch --location=vsplit
map cmd+opt+shift+enter combine : goto_layout splits : launch --location=hsplit