# WezTerm で使っていた Retro Hacker Blue ベースの見た目を Kitty へ移植する。

# --- Font -------------------------------------------------------------------

font_family Menlo
font_size 13.5

# Menlo に含まれない日本語は BIZ UDGothic を明示的に使う。
# CJK 記号、かな、漢字、互換漢字、全角文字の主要範囲を対象にする。
symbol_map U+3000-U+30FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF BIZ UDGothic

# --- Base colors -------------------------------------------------------------

foreground #5EAFFF
background #010111

cursor #FF4DE1
cursor_text_color #010111

selection_foreground #FFFFFF
# WezTerm の rgba(23, 51, 102, 0.70) を背景 #010111 上へ合成した見た目に合わせる。
selection_background #10244D

# --- ANSI colors -------------------------------------------------------------

color0  #000000
color1  #FF4DE1
color2  #4682B4
color3  #FFD700
color4  #3B85D8
color5  #8A5EC0
color6  #00CED1
color7  #E0EEFF
color8  #1A1A1A
color9  #FF4DE1
color10 #6CB8F0
color11 #FFFF00
color12 #5EAFFF
color13 #B07CFF
color14 #00FFFF
color15 #FFFFFF

# --- Tabs / window -----------------------------------------------------------

# tab bar は上部へ置き、slant で控えめにタブらしい輪郭を付ける。
tab_bar_edge top
tab_bar_style slant
tab_bar_background #010111
tab_bar_show_new_tab_button no

active_tab_foreground #FF4DE1
active_tab_background #10244D
active_tab_font_style bold

inactive_tab_foreground #4C9EEB
inactive_tab_background #010111
inactive_tab_font_style normal

# macOS 標準タイトルバーは残し、Terminal 本体と同じ背景色にする。
macos_titlebar_color background

# pane 間の境界は active / inactive とも通常文字色と同じ青に統一する。
# draw_minimal_borders の既定値により、隣接 pane を分ける線だけが描画される。
active_border_color #5EAFFF
inactive_border_color #5EAFFF
